kind = "mobile"
previewPath = "/"
title = "OneTap"
version = "1.0.0"
id = "artifacts/onetap"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20343

[services.development]
run = "pnpm --filter @workspace/onetap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onetap", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/onetap", "run", "serve" ]

[services.env]
PORT = "20343"
BASE_PATH = "/"
